# Monitoring for performance tests: Prometheus (remote-write receiver for k6), Grafana with provisioned
# dashboards, cAdvisor, Postgres and Redis exporters. Joins the shop's network qa-shop-net.
# All ports on 127.0.0.1. Start the shop first: make -C ../shop-sut up
name: qa-observability

services:
  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 5s
      retries: 20

  grafana:
    image: grafana/grafana:13.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: qa-local-grafana   # test-only, bound to 127.0.0.1
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:${GRAFANA_PORT:-3300}:3000"]
    depends_on:
      prometheus: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 5s
      retries: 30

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    privileged: true
    devices: ["/dev/kmsg"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    command: ["--docker_only=true", "--housekeeping_interval=5s", "--store_container_labels=true"]
    ports: ["127.0.0.1:${CADVISOR_PORT:-8089}:8080"]

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      # Read-only role created by shop-sut's bootstrap (member of pg_monitor).
      DATA_SOURCE_NAME: postgresql://qa_readonly:${QA_DB_READONLY_PASSWORD:-qa-local-readonly-password}@postgres:5432/medusa?sslmode=disable
    ports: ["127.0.0.1:${PG_EXPORTER_PORT:-9187}:9187"]

  redis-exporter:
    image: oliver006/redis_exporter:v1.96.0
    environment:
      REDIS_ADDR: redis://redis:6379
    ports: ["127.0.0.1:${REDIS_EXPORTER_PORT:-9121}:9121"]

networks:
  default:
    name: qa-shop-net
    external: true

volumes:
  prometheus-data:
