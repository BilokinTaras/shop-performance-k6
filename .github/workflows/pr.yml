name: PR checks

# Types, lint and format, then a 30-second smoke run whose thresholds are the gate: k6 exits 99 when an SLO
# is breached, and that fails the job.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: tsc · eslint · prettier
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: make check

  smoke:
    name: smoke (thresholds as gate)
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start the shop
        uses: BilokinTaras/shop-sut/.github/actions/start-sut@v1.0.0 # zizmor: ignore[unpinned-uses] same owner; the release tag pairs with image-tag
        with:
          image-tag: v1.0.0

      # Shared runners are noisy, so latency limits are doubled here; error-rate and check thresholds are not.
      - name: k6 smoke
        env:
          NO_PROMETHEUS: '1'
        run: sh scripts/k6.sh smoke -e THRESHOLD_SCALE=2

      - name: Summary
        if: always()
        run: |
          if [ -f results/smoke-latest.md ]; then cat results/smoke-latest.md >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: k6-smoke
          path: results/
          retention-days: 14

      - name: Stand logs on failure
        if: failure()
        uses: BilokinTaras/shop-sut/.github/actions/collect-sut-logs@v1.0.0 # zizmor: ignore[unpinned-uses] same owner, release tag
